# VM / production container. URLs and secrets come from .env.production.
#   docker compose up --build -d
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
