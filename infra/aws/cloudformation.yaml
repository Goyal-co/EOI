AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shared ECS cluster + ALB for EOI portals. One target group serves
  leads.*, customer.*, and admin.* hostnames. App image is deployed
  separately via GitHub Actions (see .github/workflows/aws-deploy.yml).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
    Description: ACM certificate covering *.partnergoyalco.com
  PartnerHost:
    Type: String
    Default: leads.partnergoyalco.com
  CustomerHost:
    Type: String
    Default: customer.partnergoyalco.com
  AdminHost:
    Type: String
    Default: admin.partnergoyalco.com

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: goyal-eoi
      CapacityProviders: [FARGATE]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/goyal-eoi-web
      RetentionInDays: 30

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EOI ALB https
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EOI web tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: goyal-eoi-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref Subnets
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: goyal-eoi-web
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /api/health?live=1
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  PartnerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref PartnerHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  CustomerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref CustomerHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AdminRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 30
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref AdminHost]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ClusterName:
    Value: !Ref Cluster
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Description: Point Route53 alias records for the three portal hosts here
  TargetGroupArn:
    Value: !Ref TargetGroup
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  PartnerUrl:
    Value: !Sub https://${PartnerHost}
  CustomerUrl:
    Value: !Sub https://${CustomerHost}
  AdminUrl:
    Value: !Sub https://${AdminHost}
